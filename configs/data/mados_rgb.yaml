# MADOS, RGB bands only. Requires `scripts/prepare_mados.py` to have run.
_target_: aquafm.data.mados.MadosDataModule
data_root: ${paths.data_root}
dataset_dir: MADOS_ml

# Band centres (nm) in R, G, B order, the order RGB backbones expect.
output_bands: [665, 560, 492]
num_channels: 3
# Read by the CopernicusFM model config.
band_wavelengths: ${data.output_bands}
# S2A FWHM for B4, B3, B2.
band_bandwidths: [30, 35, 65]

img_size: 240
num_classes: 15
# UperNet's pooling branch needs a batch of at least 2 for BatchNorm.
batch_size: 8
num_workers: 4
# null = the reference per-band statistics.
means: null
stds: null
augment: true
# Copy-paste augmentation from the reference; enabled by `protocol=mados_reference`.
vscp: false

# Read by the model configs for per-class metric names and loss weights.
class_names:
  - Marine Debris
  - Dense Sargassum
  - Sparse Floating Algae
  - Natural Organic Material
  - Ship
  - Oil Spill
  - Marine Water
  - Sediment-Laden Water
  - Foam
  - Turbid Water
  - Shallow Water
  - Waves & Wakes
  - Oil Platform
  - Jellyfish
  - Sea snot
# Reference weighting 1 / log(c + p) with c = 1.03 (`marinext/train.py --weight_param`),
# generated by `aquafm.data.mados.class_weights_from_distribution`. null = unweighted.
class_weight_smoothing: 1.03
class_weights: [30.473285, 31.352017, 30.473285, 32.324284, 26.986978, 5.145384,
                3.120595, 4.712807, 33.155880, 7.295934, 8.695210, 23.703725,
                26.026540, 31.983541, 25.730170]
