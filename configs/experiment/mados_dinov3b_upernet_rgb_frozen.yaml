# @package _global_
# mados_dinov3b_upernet_rgb with a frozen encoder.
defaults:
  - override /data: mados_rgb
  - override /model: dinov3_upernet_base
  - override /trainer: default
  - _self_

reference_batch_size: 15

trainer:
  max_epochs: 80

model:
  freeze_backbone: true
  # No effect while frozen; kept equal to the fine-tuned experiment.
  lr_overrides:
    encoder: 2.0e-5
  model_args:
    backbone_kwargs:
      ckpt_path: ${paths.weights_root}/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
