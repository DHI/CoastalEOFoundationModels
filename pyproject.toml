[build-system]
# >=77 for the PEP 639 SPDX `license` string below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aquafm-bench"
version = "0.1.0"
description = "MADOS segmentation benchmark for EO foundation models, and DINOv3 domain adaptation to tropical coastal Sentinel-2 imagery"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Pinned to the versions of the paper runs; the configs rely on TerraTorch internals.
dependencies = [
  "torch==2.8.*",
  "lightning==2.6.4",
  "torchmetrics==1.9.0",
  "hydra-core==1.3.4",
  "omegaconf>=2.3",
  "torchgeo==0.9.0",
  "terratorch==1.2.10",
  "timm==1.0.28",
  "huggingface_hub>=0.24",
  "rasterio>=1.3",
  "albumentations==2.0.8", # src/aquafm/data/mados.py transforms
  "pandas>=2.0", # scripts/aggregate_results.py
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "ruff"]
wandb = ["wandb"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
